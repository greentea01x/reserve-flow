<!-- Valid Upcoming Status: Using Pastel Blue dynamic background -->
<body class="bg-pastel-blue h-full flex flex-col font-body-md text-on-surface antialiased overflow-hidden">
<!-- Top Navigation (Mobile Specific - Back / Close action) -->
<header class="flex justify-between items-center px-4 py-6 z-10 sticky top-0 bg-transparent">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="font-headline-sm text-headline-sm text-on-surface text-center flex-1 pr-10">
            Check-in
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-4 pb-12 z-0 relative">
<!-- Animated Background Element for Premium Feel -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30 flex items-center justify-center">
<div class="w-96 h-96 bg-white rounded-full blur-[100px] animate-pulse" style="animation-duration: 4s;"></div>
</div>
<!-- QR Code Card (Level 1 Elevation) -->
<div class="bg-white rounded-xl shadow-level-1 p-8 flex flex-col items-center w-full max-w-[320px] relative z-10 border border-outline-variant/30">
<div class="mb-6 text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Alpha Boardroom</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">schedule</span>
                    10:00 AM - 11:30 AM
                </p>
</div>
<!-- QR Code Container -->
<div class="bg-surface-container-lowest rounded-lg p-4 mb-8 border border-outline-variant/50 shadow-sm relative">
<!-- Decorative scanning corners -->
<div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-primary rounded-tl-sm"></div>
<div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-primary rounded-tr-sm"></div>
<div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-primary rounded-bl-sm"></div>
<div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-primary rounded-br-sm"></div>

<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                Ready to Check-in
            </div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary rounded-full py-4 font-headline-sm text-body-lg shadow-sm hover:shadow-level-2 transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined icon-filled">qr_code_scanner</span>
                Scan to Check-in
            </button>
<!-- Manual Entry Link -->
<button class="mt-4 text-primary font-body-sm text-body-sm underline-offset-4 hover:underline">

<script>
        // Interactive visual feedback for button
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            }, {passive: true});
            btn.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            }, {passive: true});
        });
    </script>
